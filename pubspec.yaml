name: water_quality_detector_assistant
description: "水质检测仪助手"
publish_to: 'none'

version: 0.6.6+6

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 状态管理
  provider: ^6.1.5+1

  # OCR：Android / iOS 端侧离线中文识别（Google ML Kit，模型随 APK 打包）
  google_mlkit_text_recognition: ^0.17.1

  # OCR：桌面端本地 Python(PaddleOCR) 子进程（离线）；可选云端适配器（HTTP）
  http: ^1.2.2

  # 自定义拍照页（实时预览 + 长方形表格对齐框）；相册仍用 image_picker
  camera: ^0.12.2

  # 相机/相册（Android）；桌面端用 file_picker 选择
  image_picker: ^1.2.4

  # 文件选择/保存（Android + Windows）
  file_picker: ^13.3.1

  # Excel 读写
  excel: ^4.0.6

  # 图表
  fl_chart: ^1.3.0

  # 二维码：扫描(mobile) / 展示(desktop)
  mobile_scanner: ^7.4.3
  qr_flutter: ^4.1.0

  # 本地存储
  shared_preferences: ^2.5.6

  # 路径
  path: ^1.9.1
  path_provider: ^2.1.6

  # 唯一 ID / token
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
